name: Ruby Gem Push

on:
  push:
    branches: [ "main" ]
    paths:
      - '*.gemspec'

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    name: Build + Publish
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@4f1f4aec02e41874fa0262ea8ff5172d7978ad1e

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          ruby-version: '3.4'

      - uses: rubygems/release-gem@e9a6361a0b14562539327c2a02373edc56dd3169
